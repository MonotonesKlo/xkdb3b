<script>
const $=s=>document.querySelector(s),r=Math.round,r1=n=>String(Math.round(n*10)/10).replace('.',','),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=o=>JSON.parse(JSON.stringify(o)),nn=x=>parseFloat(String(x).replace(',','.'))||0;
const MEALS=[['b','Frühstück'],['l','Mittag'],['d','Abend'],['s','Snacks']],MN=m=>MEALS.find(x=>x[0]==m)[1];
// Name, kcal, Eiweiß, Kohlenhydrate, Fett je 100 g (Richtwerte)
const D0=[['Hähnchenbrust',110,23,0,1.5],['Nudeln (trocken)',356,12.5,71,1.5],['Reis (trocken)',350,7,78,0.6],['Haferflocken',372,13.5,59,7],['Ei',143,12.6,0.7,9.9],['Vollmilch 3,5 %',65,3.3,4.8,3.5],['Magerquark',67,12,3.7,0.3],['Banane',93,1,20,0.2],['Apfel',52,0.3,14,0.2],['Vollkornbrot',220,8,38,2],['Butter',741,0.7,0.6,83],['Olivenöl',884,0,0,100],['Kartoffeln',71,2,15,0.1],['Tomaten',18,0.9,2.6,0.2],['Gouda',356,25,0,28],['Hackfleisch gemischt',250,17,0,20],['Passierte Tomaten',30,1.5,5,0.3],['Skyr',63,11,4,0.2],['Joghurt natur 3,5 %',66,4,4.7,3.5],['Brokkoli',34,2.8,4,0.4],['Mozzarella',241,18,1,18],['Lachs',200,20,0,13],['Erdnussbutter',600,25,12,50],['Paprika',28,1,5,0.3],['Zwiebel',40,1.1,9,0.1],['Sahne 30 %',292,2.4,3.3,30]];
let S=null;try{S=JSON.parse(localStorage.getItem('kt1'))}catch(e){}
if(!S)S={foods:D0.map((a,i)=>({id:'d'+i,n:a[0],k:a[1],p:a[2],c:a[3],f:a[4]})),presets:[],log:{},burn:{},weights:[],pr:{n:'',sex:'m',age:30,h:178,w:80,gw:75,plan:'cut',act:1.4,kc:0}};
S.sport=S.sport||{};S.ui=S.ui||{};S.ui.sp=Object.assign({tl:1,rc:0,qt:0,run:0},S.ui.sp);if(S.pr.rate===undefined)S.pr.rate={cut:-.5,keep:0,gain:.25}[S.pr.plan]||0;
const save=()=>{try{localStorage.setItem('kt1',JSON.stringify(S))}catch(e){}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>(key(d)==key(new Date())?'Heute, ':'')+d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
let V={mod:null,tab:'diary',date:new Date(),st:[]};const topv=()=>V.st[V.st.length-1];
const F=id=>S.foods.find(x=>x.id==id),Z={k:0,p:0,c:0,f:0};
const sc=(f,a)=>f?{k:f.k*a/100,p:f.p*a/100,c:f.c*a/100,f:f.f*a/100}:Z;
const pl=(a,b)=>({k:a.k+b.k,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f}),mul=(a,m)=>({k:a.k*m,p:a.p*m,c:a.c*m,f:a.f*m});
const itN=it=>it.reduce((s,i)=>pl(s,sc(F(i.fid),i.a)),Z),eN=e=>e.items?mul(itN(e.items),e.por):sc(F(e.fid),e.amt);
const en=e=>e.items?e.n:(F(e.fid)||{n:'?'}).n;
const dk=i=>{const d=new Date();d.setDate(d.getDate()-i);return key(d)},bn=k=>(S.sport[k]||[]).reduce((s,e)=>s+e.kcal,0),cw=()=>S.weights.length?S.weights[S.weights.length-1].v:S.pr.w,sk=(m,min)=>r(Math.max(0,m-1)*cw()*min/60),win=()=>S.weights.filter(w=>w.d>=dk(27));
const slope=ws=>{if(ws.length<2)return null;const xs=ws.map(w=>Date.parse(w.d+'T12:00')/864e5),m=xs.reduce((a,b)=>a+b)/xs.length,y=ws.reduce((a,w)=>a+w.v,0)/ws.length;let a=0,b=0;ws.forEach((w,i)=>{a+=(xs[i]-m)*(w.v-y);b+=(xs[i]-m)**2});return b?a/b:null};
const base=()=>{const p=S.pr;return(10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161))*p.act};
function adapt(){const ds=[];for(let i=1;i<=28;i++){const k=dk(i),c=(S.log[k]||[]).reduce((s,e)=>s+eN(e).k,0);if(c>=800)ds.push({c,s:bn(k)})}const ws=win(),sl=slope(ws),sp=ws.length>1?(Date.parse(ws[ws.length-1].d)-Date.parse(ws[0].d))/864e5:0,n=ds.length,av=f=>ds.reduce((s,x)=>s+x[f],0)/(n||1),M=base();return{n,sl,ok:n>=10&&sl!==null&&sp>=10,E:Math.min(M*1.4,Math.max(M*.7,av('c')-(sl||0)*7700)),sp:av('s')}}
function goal(){const p=S.pr;if(p.kc>0)return p.kc;const M=base(),a=adapt(),B=a.ok?M+(a.E-a.sp-M)*Math.min(1,a.n/28):M;return Math.round(Math.max(p.sex=='m'?1500:1200,B+p.rate*1100)/10)*10}
function mt(b){const p=S.pr,w=cw(),k=goal()+b,pl_=p.plan,P=w*({cut:2.2,keep:2,gain:1.9}[pl_]||2);let F=w*({cut:.8,keep:.9,gain:1}[pl_]||.9),C=(k-P*4-F*9)/4;const lo=w*({cut:2.5,keep:3.5,gain:5}[pl_]||3.5),hi=w*({cut:4,keep:5,gain:6}[pl_]||5);if(C<lo){C=lo;F=Math.max(.6*w,(k-P*4-C*4)/9)}else if(C>hi){C=hi;F=(k-P*4-C*4)/9}return{p:P,f:F,c:C}}
const rsp=()=>{const o=[],seen={};Object.keys(S.sport).sort().reverse().forEach(k=>S.sport[k].slice().reverse().forEach(e=>{const x=e.n+e.min+e.kcal;if(seen[x]||o.length>=10)return;seen[x]=1;o.push(e)}));return o},fsp=id=>Object.values(S.sport).flat().find(e=>e.id==id);
const ring=(pct,col,sz,sw,tr)=>{const R=(sz-sw)/2,c=2*Math.PI*R,h=sz/2;return `<svg width="${sz}" height="${sz}"><circle cx="${h}" cy="${h}" r="${R}" fill="none" stroke="${tr}" stroke-width="${sw}"/><circle cx="${h}" cy="${h}" r="${R}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*Math.min(1,Math.max(0,pct||0))} ${c}" transform="rotate(-90 ${h} ${h})"/></svg>`};
const macros=n=>{const t=n.c*4+n.p*4+n.f*9||1;return [['Kohlenhydrate',n.c,n.c*4/t,'#f5a623'],['Eiweiß',n.p,n.p*4/t,'#3b9cff'],['Fett',n.f,n.f*9/t,'#ff6b6b']].map(([l,g,p,c])=>`<div class="mc"><div class="rw">${ring(p,c,78,8,'#eee')}<div class="ct" style="color:#111"><b style="font-size:16px">${r(p*100)}%</b></div></div><div>${l}</div><small>${r1(g)} g</small></div>`).join('')};
const tbl=n=>`<table><tr><td>Kalorien</td><td>${r(n.k)} kcal</td></tr><tr><td>Eiweiß</td><td>${r1(n.p)} g</td></tr><tr><td>Kohlenhydrate</td><td>${r1(n.c)} g</td></tr><tr><td>Fett</td><td>${r1(n.f)} g</td></tr></table>`;
const findE=id=>Object.values(S.log).flat().find(e=>e.id==id);
const recent=m=>{const seen={},o=[];Object.keys(S.log).sort().reverse().forEach(k=>S.log[k].slice().reverse().forEach(e=>{const s=e.items?'p'+e.n:e.fid;if(e.meal!=m||seen[s]||o.length>=15)return;seen[s]=1;o.push(e)}));return o};
const res=q=>{q=q.trim().toLowerCase();const e=topv().t=='ed';return (q?S.foods.filter(f=>f.n.toLowerCase().includes(q)).slice(0,20):[]).map(f=>`<div class="row" data-a="${e?'ingr':'pick'}" data-id="${f.id}"><div><b>${esc(f.n)}</b><small>${r(f.k)} kcal je 100 g</small></div></div>`).join('')+(q?`<div class="row" data-a="nf"><div><b>+ Eigenes Lebensmittel anlegen</b></div></div>`:'')};
const li=(src,e)=>{const n=e.items?mul(itN(e.items),e.por||1):eN(e);return `<div class="row"><div data-a="rname" data-src="${src}" data-id="${e.id}"><b>${esc(en(e))}</b><small>${r(n.k)} kcal${e.items?'':' · '+e.amt+' g'}</small></div><button class="plus" data-a="radd" data-src="${src}" data-id="${e.id}">+</button></div>`};

function diary(){const k=key(V.date),es=S.log[k]||[],t=es.reduce((s,e)=>pl(s,eN(e)),Z),b=bn(k),g=goal(),l=g+b-t.k,m=mt(b),sp=S.sport[k]||[];
return `<div class="top"><div class="date"><button data-a="day" data-d="-1">‹</button><b data-a="dcal" style="cursor:pointer">${fd(V.date)} ▾</b><button data-a="day" data-d="1">›</button></div>
<div class="ringrow"><div class="side"><b>${r(t.k)}</b><span>Gegessen</span></div><div class="rw">${ring(t.k/(g+b),'#2fd37a',170,14,'#262626')}<div class="ct"><b>${r(Math.abs(l))}</b><span>${l>=0?'kcal übrig':'kcal drüber'}</span></div></div><div class="side"><b>${r(b)}</b><span>Verbraucht</span></div></div><div class="mb">${[['Kohlenhydrate',t.c,m.c,'#f5a623'],['Eiweiß',t.p,m.p,'#3b9cff'],['Fett',t.f,m.f,'#ff6b6b']].map(([n,v,z,c])=>`<div><span>${n}</span><i><u style="width:${Math.min(100,v/z*100||0)}%;background:${c}"></u></i><small>${r(v)} / ${r(z)} g</small></div>`).join('')}</div></div>
<div class="sheet">${MEALS.map(([m,n])=>{const L=es.filter(e=>e.meal==m);return `<div class="meal"><div class="in"><h3>${n}</h3><small>${L.map(e=>`<a data-a="ent" data-id="${e.id}">${esc(en(e))}</a>`).join(', ')||'Noch nichts getrackt'}</small></div><span class="k">${r(L.reduce((s,e)=>s+eN(e).k,0))} kcal</span><button class="plus" data-a="add" data-m="${m}">+</button></div>`}).join('')}<div class="meal"><div class="in"><h3>Sport</h3><small>${sp.map(e=>`<a data-a="sent" data-id="${e.id}">${e.ico} ${esc(e.n)}${e.min?' '+r(e.min)+' min':''}</a>`).join(', ')||'Noch nichts getrackt'}</small></div><span class="k">${r(b)} kcal</span><button class="plus" data-a="sport">+</button></div><button class="big" data-a="cpy" style="background:#111;color:#fff">Letzten Trainingstag übernehmen</button></div>`}

function addScr(s){const k=key(V.date),t=(S.log[k]||[]).reduce((a,e)=>pl(a,eN(e)),Z),g=goal()+bn(k),L=s.tab=='rec'?recent(s.m).map(e=>li('rec',e)):S.presets.map(p=>li('pre',p));
return `<div class="wrap"><div class="hd"><button class="bk" data-a="back">‹</button><h2>${MN(s.m)}</h2></div>
<div class="dk"><input data-i="q" placeholder="Lebensmittel suchen" value="${esc(s.q)}"><div id="res">${res(s.q)}</div></div>
<div class="cov"><div class="rw">${ring(t.k/g,'#2fd37a',92,9,'#262626')}<div class="ct"><b>${r(g-t.k)}</b><span>übrig</span></div></div><div>Gegessen: <b>${r(t.k)}</b> von ${r(g)} kcal<br><span class="mu">Kohlenhydrate ${r(t.c)} g · Eiweiß ${r(t.p)} g · Fett ${r(t.f)} g</span></div></div>
<div class="tabs"><button class="${s.tab=='rec'?'on':''}" data-a="stab" data-t="rec">🕒</button><button class="${s.tab=='pre'?'on':''}" data-a="stab" data-t="pre"><span class="pm">☰<i>+</i></span></button></div>
<div class="sheet">${L.join('')||`<p class="mu">${s.tab=='rec'?'Noch keine Mahlzeiten in dieser Kategorie.':'Noch keine Presets. Lege sie im Reiter Presets an.'}</p>`}<button class="big" data-a="back">Speichern</button></div></div>`}

function spScr(s){const u=S.ui.sp,sec=(k,t,b)=>`<div class="sh" data-a="sx" data-k="${k}"><b>${t}</b><span>${u[k]?'▾':'▸'}</span></div>${u[k]?`<div class="sb">${b}</div>`:''}`,

rc=rsp().map(e=>`<div class="row"><span class="ic">${e.ico}</span><div><b>${esc(e.n)}</b><small>${e.min?r(e.min)+' min · ':''}${e.kcal} kcal</small></div><button class="plus" data-a="sadd" data-id="${e.id}">+</button></div>`).join('')||'<p class="mu">Noch nichts getrackt.</p>',

return `<div class="wrap"><div class="hd"><button class="bk" data-a="back">‹</button><h2>Sport</h2></div><div class="dk">${sec('tl','Trainingsliste',tl)}${sec('rc','Kürzlich getrackt',rc)}${sec('qt','Schnelles Tracking',qt)}</div></div>`}
function seScr(s){return `<div class="wrap"><div class="hd"><button class="bk" data-a="back">‹</button><h2>${s.ico} ${esc(s.n)}</h2></div><div class="sheet d">${s.met?`<label>Dauer (Minuten)<input type="number" inputmode="numeric" data-i="smin" value="${s.min}"></label><div class="kc"><b id="skc">${sk(s.met,s.min)}</b> kcal</div><p class="mu">Berechnet aus Dauer, Körpergewicht und Intensität (MET ${s.met}).</p>`:`<label>Kalorien (kcal)<input type="number" inputmode="decimal" data-i="skc" value="${s.kcal||''}"></label>`}<button class="big" data-a="ssave">${s.mode=='new'?'Hinzufügen':'Speichern'}</button>${s.mode=='entry'?'<button class="big del" data-a="sdel">Löschen</button>':''}</div></div>`}
